<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CC1 Study Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13101B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CC1 Lab">
<meta name="application-name" content="CC1 Lab">
<meta name="description" content="ติวสอบใบประกอบวิชาชีพเภสัชกรรม CC1: บทเรียนเต็ม ภาพอธิบาย เทคนิคจำ และเกม">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--bg:#F5F4F9;--ink:#1E1730;--muted:#655E7B;--violet:#5A2A8A;--line:#DFDAEA}
@media (prefers-color-scheme:dark){:root{--bg:#13101B;--ink:#EDE9F5;--muted:#A79FBD;--violet:#B48CE6;--line:#2E2740}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
.boot{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.boot img{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 28px rgba(30,23,48,.18)}
.boot b{font-size:20px}
.boot p{margin:0;color:var(--muted);font-size:15px;line-height:1.5;max-width:320px}
.bar{width:160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--violet);border-radius:4px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.boot button{border:0;border-radius:999px;padding:10px 20px;background:var(--violet);color:#fff;font:inherit;font-weight:600}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
<script src="config.js"></script>
<script src="transform-web.js"></script>
</head>
<body>
<div class="boot" id="boot">
  <img src="icon-192.png" alt="">
  <b>CC1 Study Lab</b>
  <div class="bar" id="bootBar"><i></i></div>
  <p id="bootMsg">กำลังเปิดบทเรียน…</p>
</div>
<script>
/* โหลดเนื้อหาเวอร์ชันล่าสุดจาก Google Apps Script แล้วเปิดเป็นแอป
 * ครั้งต่อไปเปิดจากตัวที่เก็บไว้ในเครื่องทันที (ใช้ได้แม้ไม่มีเน็ต) และอัปเดตเบื้องหลัง */
(function () {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  var msg = document.getElementById('bootMsg');
  function fail(text) {
    document.getElementById('bootBar').style.display = 'none';
    msg.textContent = text;
    var b = document.createElement('button'); b.type = 'button'; b.textContent = 'ลองอีกครั้ง';
    b.onclick = function () { location.reload(); };
    document.getElementById('boot').appendChild(b);
  }
  var api = (window.CC1_API || '').trim();
  if (!/^https:\/\/script\.google\.com\//.test(api)) { fail('ยังไม่ได้ตั้งค่าลิงก์ Google Apps Script ใน config.js'); return; }
  var slow = setTimeout(function () { msg.textContent = 'เปิดครั้งแรกอาจใช้เวลาสักครู่…'; }, 4000);
  fetch(api + '?raw=index', { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (raw) {
      if (raw.length < 100000 || raw.indexOf('<title>CC1 Study Lab</title>') < 0) throw new Error('bad content');
      var html = window.__pwaT(raw);
      clearTimeout(slow);
      document.open(); document.write(html); document.close();
    })
    .catch(function () {
      clearTimeout(slow);
      fail(navigator.onLine ? 'โหลดบทเรียนไม่สำเร็จ ลองใหม่อีกครั้ง' : 'ยังไม่มีบทเรียนในเครื่อง ต่อเน็ตแล้วเปิดครั้งแรกก่อน');
    });
})();
</script>
</body>
</html>
