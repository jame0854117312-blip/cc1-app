# เผยแพร่แอป CC1 ขึ้น GitHub Pages
# แอปดึงเนื้อหาบทเรียนล่าสุดจาก Google Apps Script เองตอนเปิด ไม่ต้องแก้ไฟล์ในนี้เมื่ออัปเดตบทเรียน
name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect app files
        run: |
          mkdir _site
          cp index.html sw.js config.js transform-web.js manifest.webmanifest *.png _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
